name: relay

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'target url'
        required: true
      out:
        description: 'output file name'
        required: true

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        env:
          TARGET: ${{ inputs.url }}
          OUTNAME: ${{ inputs.out }}
        run: |
          mkdir -p out
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ['TARGET']
          out = os.environ['OUTNAME']
          req = urllib.request.Request(url, headers={
              'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'accept': 'text/html,application/json,*/*',
              'accept-language': 'en-US,en;q=0.9',
          })
          try:
              with urllib.request.urlopen(req, timeout=40) as r:
                  body = r.read()
                  data = {'status': r.status, 'ts': int(__import__('time').time()),
                          'ctype': r.headers.get('content-type', ''), 'b64': base64.b64encode(body).decode()}
          except Exception as e:
              data = {'status': 0, 'ts': int(__import__('time').time()), 'error': str(e)[:200]}
          with open('out/' + out, 'w') as f:
              json.dump(data, f)
          print('done', data.get('status'), len(data.get('b64', '')))
          PY
      - name: commit
        run: |
          git config user.name relay-bot
          git config user.email relay@users.noreply.github.com
          git add -A out
          git commit -m "relay: ${{ inputs.out }}" || echo "no change"
          git push
