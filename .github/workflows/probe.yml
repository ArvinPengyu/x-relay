name: probe

on:
  workflow_dispatch:
    inputs:
      user:
        description: 'username'
        required: true

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        env:
          USER: ${{ inputs.user }}
        run: |
          mkdir -p out
          python3 - <<'PY'
          import os, json, re, urllib.request, time
          u = os.environ['USER']
          urls = [
            ("syndication", "https://syndication.twitter.com/srv/timeline-profile/screen-name/" + u),
            ("nitter-netbub", "https://nitter.netbub.com/" + u + "/rss"),
            ("nitter-mizuki", "https://nitter.mizuki.st/" + u + "/rss"),
            ("nitter-tiekoetter", "https://nitter.tiekoetter.com/" + u + "/rss"),
            ("jina-x", "https://r.jina.ai/https://x.com/" + u),
            ("fxtwitter-user", "https://api.fxtwitter.com/" + u),
            ("brave", "https://search.brave.com/search?q=" + urllib.parse.quote("site:x.com " + u)),
          ]
          res = []
          for name, url in urls:
            t0 = time.time()
            item = {"name": name, "url": url}
            try:
              req = urllib.request.Request(url, headers={
                'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                'accept-language': 'en-US,en;q=0.9'})
              with urllib.request.urlopen(req, timeout=25) as r:
                body = r.read()
                txt = body.decode('utf-8', 'ignore')
                item.update(status=r.status, len=len(body),
                            ids=len(set(re.findall(r'"id_str":"(\d{5,25})"', txt))),
                            links=len(set(re.findall(r'/status/(\d{5,25})', txt))),
                            hasuser=txt.lower().count(u.lower()))
            except Exception as e:
              item.update(status=0, error=str(e)[:120])
            item["ms"] = int((time.time() - t0) * 1000)
            res.append(item)
            print(item["name"], item.get("status"), item.get("ids"), item.get("links"), item.get("error", ""))
          json.dump(res, open('out/probe.json', 'w'), ensure_ascii=False, indent=1)
          PY
      - name: commit
        run: |
          git config user.name relay-bot
          git config user.email relay@users.noreply.github.com
          git add -A out
          git commit -m "probe" || echo "no change"
          git pull --rebase origin main || true
          git push
