name: render

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'page url'
        required: true
      out:
        description: 'output file'
        required: true
      scrolls:
        description: 'scroll count'
        required: false
        default: '3'

concurrency:
  group: render
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: render
        env:
          TARGET: ${{ inputs.url }}
          OUTNAME: ${{ inputs.out }}
          SCROLLS: ${{ inputs.scrolls }}
        run: |
          npm install playwright@1.49.0 --no-audit --no-fund --loglevel=error
          xvfb-run -a node render.js
      - name: commit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name relay-bot
          git config user.email relay@users.noreply.github.com
          printf 'node_modules/\n' > .gitignore
          git add -A out .gitignore
          git commit -m "render" || echo "no change"
          git -c rebase.autoStash=true pull --rebase origin main || true
          git push
